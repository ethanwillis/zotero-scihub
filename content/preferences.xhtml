<linkset>
  <html:link rel="localization" href="zotero-scihub.ftl"/>
</linkset>
<vbox id="zotero-prefpane-zoteroscihub">
  <checkbox id="id-zoteroscihub-automatic-pdf-download"
            preference="extensions.zotero.zoteroscihub.automatic_pdf_download"
            data-l10n-id="zotero-scihub-pref-automatic-pdf-download"/>
  <hbox align="center">
    <label control="id-zoteroscihub-provider" data-l10n-id="zotero-scihub-pref-provider"/>
    <menulist id="id-zoteroscihub-provider"
              preference="extensions.zotero.zoteroscihub.provider">
      <menupopup>
        <menuitem value="scihub" label="Sci-Hub"/>
        <menuitem value="annas-archive" label="Anna's Archive"/>
      </menupopup>
    </menulist>
  </hbox>
  <hbox align="center">
    <html:label for="id-zoteroscihub-scihub-url" data-l10n-id="zotero-scihub-pref-scihub-url"></html:label>
    <html:input type="text" id="id-zoteroscihub-scihub-url"
                preference="extensions.zotero.zoteroscihub.scihub_url"/>
  </hbox>
  <hbox align="center">
    <html:label for="id-zoteroscihub-scinet-url" data-l10n-id="zotero-scihub-pref-scinet-url"></html:label>
    <html:input type="text" id="id-zoteroscihub-scinet-url"
                preference="extensions.zotero.zoteroscihub.scinet_url"/>
  </hbox>
  <description data-l10n-id="zotero-scihub-pref-help"></description>
</vbox>
